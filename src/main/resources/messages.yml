# Donut Essentials 3.0 messages. MiniMessage format (https://docs.advntr.dev/minimessage/format.html); legacy & codes
# and &#RRGGBB work too. An empty message ("") is not sent. Placeholders look like <player>.
messages-version: 1

prefix: "<#6bc6ff><bold>Donut</bold></#6bc6ff> <dark_gray>»</dark_gray> "

common:
  no-permission: "<#ff6b6b>You don't have permission to do that."
  player-only: "<#ff6b6b>Only players can use this command."
  player-not-found: "<#ff6b6b>No player named <white><player></white> is online."
  player-never-joined: "<#ff6b6b><white><player></white> has never played here."
  error: "<#ff6b6b>Something went wrong. The console has the details."
  input-chat: "<gray>Type your answer in chat, or <white>cancel</white>."
  input-cancelled: "<gray>Cancelled."
  while-away-header: "<gray>While you were away <dark_gray>(<white><count></white>)</dark_gray>:"
  "on": "<#7ee081>on"
  "off": "<#ff6b6b>off"
  "yes": "<#7ee081>yes"
  "no": "<#ff6b6b>no"
  none: "<dark_gray>none"
  console: "Console"

dialogs:
  text-field: "<gray>Your answer"
  submit: "<#7ee081>Done"
  cancel: "<#ff6b6b>Cancel"

teleport:

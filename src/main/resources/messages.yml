    - "<gray>Kits <white><kits></white> <dark_gray>(<kit_items> items, <kit_skipped> lines skipped)</dark_gray> <dark_gray>·</dark_gray> <gray>bans <white><bans>"
    - "<gray>Unreadable entries: <white><problems>"
    - "<dark_gray><st>                                        </st>"
  done:
    - "<#7ee081><bold>Imported from EssentialsX</bold>"

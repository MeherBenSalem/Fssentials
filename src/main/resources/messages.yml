# Donut Essentials 3.0 messages. MiniMessage format (https://docs.advntr.dev/minimessage/format.html); legacy & codes
# and &#RRGGBB work too. An empty message ("") is not sent. Placeholders look like <player>.
messages-version: 1

prefix: "<#6bc6ff><bold>Donut</bold></#6bc6ff> <dark_gray>»</dark_gray> "

common:
  no-permission: "<#ff6b6b>You don't have permission to do that."
  player-only: "<#ff6b6b>Only players can use this command."
  player-not-found: "<#ff6b6b>No player named <white><player></white> is online."
  player-never-joined: "<#ff6b6b><white><player></white> has never played here."
  error: "<#ff6b6b>Something went wrong. The console has the details."
  input-chat: "<gray>Type your answer in chat, or <white>cancel</white>."
  input-cancelled: "<gray>Cancelled."
  while-away-header: "<gray>While you were away <dark_gray>(<white><count></white>)</dark_gray>:"
  "on": "<#7ee081>on"
  "off": "<#ff6b6b>off"
  "yes": "<#7ee081>yes"
  "no": "<#ff6b6b>no"
  none: "<dark_gray>none"
  console: "Console"

dialogs:
  text-field: "<gray>Your answer"
  submit: "<#7ee081>Done"
  cancel: "<#ff6b6b>Cancel"

teleport:
  warmup: "<gray>Teleporting in <white><seconds>s</white>. Don't move."
  warmup-title: "<#6bc6ff>Teleporting in <white><seconds>"
  warmup-subtitle: "<gray>Don't move"
  cancelled-move: "<#ff6b6b>Teleport cancelled: you moved."
  cancelled-damage: "<#ff6b6b>Teleport cancelled: you took damage."
  cooldown: "<#ff6b6b>You can teleport again in <white><time></white>."
  in-combat: "<#ff6b6b>You're in combat. Wait <white><seconds>s</white>."
  cannot-afford: "<#ff6b6b>That teleport costs <#ffc24b><cost></#ffc24b>."
  paid: "<gray>Paid <#ffc24b><cost></#ffc24b> for the teleport."
  no-destination: "<#ff6b6b>That place can't be reached right now."
  failed: "<#ff6b6b>The teleport failed."

admin:
  reloaded: "<#7ee081>Reloaded config, messages and menus <dark_gray>(<ms> ms)</dark_gray>."
  update: "<gray>Donut Essentials <white><latest></white> is out (you have <white><version></white>). <click:open_url:'<url>'><#6bc6ff><u>Download</u></#6bc6ff></click>"
  import-usage: "<gray>Usage: <white>/<label> import essentials [confirm]</white>"
  help:
    - "<dark_gray><st>                                        </st>"
    - "<#6bc6ff><bold>Donut Essentials</bold></#6bc6ff> <gray><version>"
    - "<white>/<label> info</white> <dark_gray>·</dark_gray> <gray>version, storage, modules"
    - "<white>/<label> reload</white> <dark_gray>·</dark_gray> <gray>config, messages and menus"
    - "<white>/<label> import essentials</white> <dark_gray>·</dark_gray> <gray>switch from EssentialsX"
    - "<dark_gray><st>                                        </st>"
  info:
    - "<dark_gray><st>                                        </st>"
    - "<#6bc6ff><bold>Donut Essentials</bold></#6bc6ff> <white><version>"
    - "<gray>Server <white><platform></white> <dark_gray>·</dark_gray> <gray>Java <white><java>"
    - "<gray>Storage <white><storage></white> <dark_gray>·</dark_gray> <gray>Economy <white><economy>"
    - "<gray>Players <white><players></white> <dark_gray>·</dark_gray> <gray>Commands <white><commands>"
    - "<gray>Dialogs <white><dialogs></white> <dark_gray>·</dark_gray> <gray>PlaceholderAPI <white><placeholderapi></white> <dark_gray>·</dark_gray> <gray>Vault <white><vault>"
    - "<gray>Modules (<white><module_count></white>): <white><modules>"
    - "<dark_gray><st>                                        </st>"

usage:
  donutessentials: "<gray>Usage: <white>/<label> <help|info|reload|import></white>"
  delhome: "<gray>Usage: <white>/<label> <home></white>"

homes:
  set: "<#7ee081>Home <white><home></white> set. <dark_gray>(<count>/<limit>)</dark_gray>"
  moved: "<#7ee081>Home <white><home></white> moved here."
  deleted: "<gray>Home <white><home></white> deleted."
  deleted-other: "<gray>Deleted <white><player></white>'s home <white><home></white>."
  teleported: "<gray>Welcome home <dark_gray>(<white><home></white>)</dark_gray>."
  none: "<gray>You have no homes yet. Set one with <white>/sethome</white>."
  not-found: "<#ff6b6b>You have no home called <white><home></white>. <gray>Your homes: <white><homes>"
  not-found-other: "<#ff6b6b><white><player></white> has no home called <white><home></white>."
  limit: "<#ff6b6b>You can have <white><limit></white> homes. Delete one first, or move one with <white>/sethome <name></white>."
  invalid-name: "<#ff6b6b>Home names are 1-16 letters, digits, - or _."
  world-disabled: "<#ff6b6b>You can't set homes in this world."
  world-missing: "<#ff6b6b>Home <white><home></white> is in <white><world></white>, which isn't loaded."
  prompt-title: "<#6bc6ff>New home"
  prompt: "<gray>Name the home you're standing in."
  confirm-delete: "Delete this home"

afk:
  tab-prefix: "<gray>[AFK] "

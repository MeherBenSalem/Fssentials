    - "<gray>Players <white><players></white> <dark_gray>·</dark_gray> <gray>Commands <white><commands>"
    - "<gray>Dialogs <white><dialogs></white> <dark_gray>·</dark_gray> <gray>PlaceholderAPI <white><placeholderapi></white> <dark_gray>·</dark_gray> <gray>Vault <white><vault>"

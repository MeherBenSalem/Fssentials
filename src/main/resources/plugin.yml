name: DonutEssentials
main: dev.nightbeam.donutessentials.DonutEssentialsPlugin
version: '${version}'
api-version: '1.20'
folia-supported: true
author: NightBeam
website: https://modrinth.com/plugin/donutessentials
description: Homes, warps, teleports, kits, economy, chat, moderation and staff tools in one plugin for Paper, Folia and Purpur.
softdepend: [Vault, VaultUnlocked, PlaceholderAPI, LuckPerms, DonutRTP]
# Commands are registered from commands.yml at start-up (switched off ones are never registered).

permissions:
  donutessentials.admin:
    default: op
    description: /donutessentials (reload, info, import) and update notices.
  donutessentials.back.death:
    default: true
    description: /back returns to where you died.
  donutessentials.bypass.warmup:
    default: op
    description: Teleports start at once.
  donutessentials.bypass.cooldown:
    default: op
    description: No teleport cooldowns.
  donutessentials.bypass.cost:
    default: op
    description: Teleports are free.
  donutessentials.bypass.combat:
    default: false
    description: Never tagged in combat.
  donutessentials.command.sethome: {default: true}
  donutessentials.command.home: {default: true}
  donutessentials.command.delhome: {default: true}
  donutessentials.command.homes: {default: true}
  donutessentials.homes.others:
    default: op
    description: Visit, list and delete other players' homes (player:home).
  donutessentials.homes.anyworld:
    default: op
    description: Set homes in disabled worlds.

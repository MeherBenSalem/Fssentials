# Donut Essentials 3.0 menus. Every title, slot, item and line of text can be changed here.
#
#  slot / slots     where an item goes (0 = top left, 8 = top right, 9 = second row...). Ranges like "10-16" work.
#  material         any item name. PLAYER_HEAD shows the viewer's head.
#  name / lore      MiniMessage (or & codes). Placeholders such as <home>, <world>, <balance> are filled in.
#  content          slots that list things (homes, warps, kits...). Longer lists get pages.
#  glow: true       adds the enchantment shine.
#  Remove an item (or set its slot to -1) to hide it.
menus-version: 1

filler:
  material: GRAY_STAINED_GLASS_PANE
  name: " "

common:
  previous: {material: ARROW, name: "<white>Previous page", lore: ["<gray>Page <page>/<pages>"]}
  next: {material: ARROW, name: "<white>Next page", lore: ["<gray>Page <page>/<pages>"]}
  back: {material: DARK_OAK_DOOR, name: "<gray>Back"}
  close: {material: BARRIER, name: "<#ff6b6b>Close"}
  empty: {material: GRAY_DYE, name: "<gray>Nothing here yet"}

confirm:
  title: "<dark_gray>Are you sure?"
  rows: 3
  items:
    subject: {slot: 13, material: PAPER, name: "<white><subject>"}
    confirm:
      slots: ["10-12"]
      material: LIME_STAINED_GLASS_PANE
      name: "<#7ee081><bold>Confirm"
      lore: ["<gray><action>"]
    cancel:
      slots: ["14-16"]
      material: RED_STAINED_GLASS_PANE
      name: "<#ff6b6b><bold>Cancel"

homes:
  title: "<dark_gray>Homes · <player> <dark_gray>(<count>/<limit>)"
  rows: 4
  content: ["10-16", "19-25"]
  items:
    home:
      material: RED_BED
      name: "<#6bc6ff><bold><home>"
      lore:
        - "<gray>World <white><world>"
        - "<gray>At <white><coords>"
        - ""
        - "<#7ee081>Click to teleport"
        - "<#ff6b6b>Shift + right-click to delete"
    icon-overworld: {material: RED_BED}
    icon-nether: {material: CRIMSON_NYLIUM}
    icon-end: {material: END_STONE}
    icon-missing: {material: BARRIER}
    set:
      slot: 30
      material: LIME_DYE
      name: "<#7ee081><bold>Set a home here"
      lore: ["<gray>Name it, and it's saved", "<gray>where you stand."]
    close: {slot: 32}
    previous: {slot: 27}
    next: {slot: 35}

kits:
  title: "<dark_gray>Kits <dark_gray>(<count>)"
  rows: 4
  content: ["10-16", "19-25"]
  items:
    # Each kit uses its own icon (the item held when it was created). glow-when-ready shines the ones you can claim.
    kit:
      material: CHEST
      glow-when-ready: true
      name: "<#6bc6ff><bold><kit>"
      lore:
        - "<status>"
        - "<price>"
        - "<gray>Cooldown <white><cooldown>"
        - "<gray>Items <white><items>"
        - ""
        - "<#7ee081>Click to claim"
        - "<gray>Right-click to preview"
    previous: {slot: 27}
    close: {slot: 31}
    next: {slot: 35}

kit-preview:
  title: "<dark_gray>Kit · <kit>"
  rows: 6
  content: ["0-44"]
  items:
    back: {slot: 45}
    previous: {slot: 48}
    claim:
      slot: 49
      material: LIME_DYE
      name: "<#7ee081><bold>Claim <kit>"
      lore: ["<status>", "<price>", "<gray>Cooldown <white><cooldown>"]
    next: {slot: 50}
    close: {slot: 53}

baltop:
  title: "<dark_gray>Richest players"
  rows: 6
  content: ["10-16", "19-25", "28-34"]
  items:
    entry:
      material: PLAYER_HEAD
      name: "<#ffc24b><bold>#<rank></bold> <white><player>"
      lore: ["<gray>Balance <#ffc24b><balance>"]
    previous: {slot: 45}
    close: {slot: 48}
    you:
      slot: 49
      material: PLAYER_HEAD
      name: "<#6bc6ff><bold>You</bold> <dark_gray>(<white><rank></white>)"
      lore:
        - "<gray>Balance <#ffc24b><balance>"
        - ""
        - "<gray>Server total <#ffc24b><total>"
        - "<dark_gray>Updated <updated> ago"
    next: {slot: 53}

# Fragment of menus.yml (fork "travel").

warps:
  title: "<dark_gray>Warps <dark_gray>(<count>)"
  rows: 4
  content: ["10-16", "19-25"]
  items:
    warp:
      # The material is only used for warps without an icon; /setwarp uses the item in your hand.
      material: ENDER_PEARL
      name: "<#6bc6ff><bold><warp>"
      lore:
        - "<gray>World <white><world>"
        - "<gray>At <white><coords>"
        - "<gray>Visits <white><visits>"
        - ""
        - "<#7ee081>Click to warp"
        - "<lore>"
    close: {slot: 31}
    previous: {slot: 27}
    next: {slot: 35}

reports:
  title: "<dark_gray>Reports <dark_gray>(<count> open)"
  rows: 6
  content: ["10-16", "19-25", "28-34", "37-43"]
  items:
    report:
      material: PLAYER_HEAD
      name: "<#a77bff><bold><player></bold> <dark_gray>#<id>"
      lore:
        - "<gray>Reported by <white><reporter>"
        - "<gray>Reason <white><reason>"
        - "<gray><ago> ago"
        - ""
        - "<#7ee081>Click to teleport"
        - "<#6bc6ff>Right-click to claim"
        - "<#ff6b6b>Shift + right-click to close"
    report-claimed:
      material: PLAYER_HEAD
      name: "<#a77bff><bold><player></bold> <dark_gray>#<id>"
      lore:
        - "<gray>Reported by <white><reporter>"
        - "<gray>Reason <white><reason>"
        - "<gray><ago> ago <dark_gray>·</dark_gray> <#6bc6ff>claimed by <white><handler>"
        - ""
        - "<#7ee081>Click to teleport"
        - "<#ff6b6b>Shift + right-click to close"
    close: {slot: 49}
    previous: {slot: 45}
    next: {slot: 53}

hub:
  # /menu. Each button runs its `command` and is hidden when that command is switched off (or the player may not use
  # it). Placeholders: <player>, <display>, <balance>, <homes>, <playtime>, <first_join>, <number>.
  title: "<dark_gray>Menu · <player>"
  rows: 4
  items:
    profile:
      slot: 4
      material: PLAYER_HEAD
      name: "<#6bc6ff><bold><display>"
      lore:
        - "<gray>Balance <#ffc24b><balance>"
        - "<gray>Homes <white><homes>"
        - "<gray>Play time <white><playtime>"
        - "<gray>Player <white>#<number></white> <dark_gray>· since <first_join>"
    homes:
      slot: 10
      material: RED_BED
      command: homes
      name: "<#6bc6ff><bold>Homes"
      lore: ["<gray>Your homes <dark_gray>(<white><homes></white>)", "", "<#7ee081>Click to open"]
    warps:
      slot: 11
      material: COMPASS
      command: warps
      name: "<#6bc6ff><bold>Warps"
      lore: ["<gray>The server's warp points.", "", "<#7ee081>Click to open"]
    kits:
      slot: 12
      material: CHEST
      command: kit
      name: "<#6bc6ff><bold>Kits"
      lore: ["<gray>Claim your kits.", "", "<#7ee081>Click to open"]
    spawn:
      slot: 13
      material: BEACON
      command: spawn
      name: "<#6bc6ff><bold>Spawn"
      lore: ["<gray>Back to the server spawn.", "", "<#7ee081>Click to teleport"]
    rtp:
      slot: 14
      material: GRASS_BLOCK
      command: rtp
      name: "<#6bc6ff><bold>Random teleport"
      lore: ["<gray>Somewhere new in the wild.", "", "<#7ee081>Click to teleport"]
    balance:
      slot: 15
      material: GOLD_INGOT
      command: baltop
      name: "<#ffc24b><bold>Money"
      lore: ["<gray>You have <#ffc24b><balance></#ffc24b>.", "", "<#7ee081>Click for the richest players"]
    mail:
      slot: 16
      material: WRITABLE_BOOK
      command: mail read
      name: "<#6bc6ff><bold>Mail"
      lore: ["<gray>Messages left for you.", "", "<#7ee081>Click to read"]
    settings:
      slot: 22
      material: COMPARATOR
      command: settings
      name: "<#6bc6ff><bold>Settings"
      lore: ["<gray>Requests, messages, pings", "<gray>and more, your way.", "", "<#7ee081>Click to open"]
    close: {slot: 31}

settings:
  # /settings. Each switch flips one personal setting. `requires`: hidden unless that command exists;
  # `requires-module`: hidden unless that module is on. `material-off`: the icon while the setting is off.
  title: "<dark_gray>Settings"
  rows: 4
  items:
    tpa:
      slot: 11
      material: ENDER_PEARL
      material-off: GRAY_DYE
      requires: tpa
      name: "<#6bc6ff><bold>Teleport requests"
      lore: ["<gray>Let others send you /tpa", "<gray>and /tpahere requests.", "", "<gray>Now: <state>", "", "<#7ee081>Click to switch"]
    tpa-auto:
      slot: 13
      material: CHORUS_FRUIT
      material-off: GRAY_DYE
      requires: tpa
      name: "<#6bc6ff><bold>Accept requests at once"
      lore: ["<gray>Teleport requests are accepted", "<gray>without asking you.", "", "<gray>Now: <state>", "", "<#7ee081>Click to switch"]
    messages:
      slot: 15
      material: PAPER
      material-off: GRAY_DYE
      requires: msg
      name: "<#6bc6ff><bold>Private messages"
      lore: ["<gray>Let others /msg you.", "", "<gray>Now: <state>", "", "<#7ee081>Click to switch"]
    mentions:
      slot: 20
      material: BELL
      material-off: GRAY_DYE
      requires-module: chat
      name: "<#6bc6ff><bold>Mention pings"
      lore: ["<gray>A sound when someone writes", "<gray>@<player> in chat.", "", "<gray>Now: <state>", "", "<#7ee081>Click to switch"]
    payments:
      slot: 22
      material: GOLD_NUGGET
      material-off: GRAY_DYE
      requires: pay
      name: "<#6bc6ff><bold>Payments"
      lore: ["<gray>Let others /pay you.", "", "<gray>Now: <state>", "", "<#7ee081>Click to switch"]
    join-messages:
      slot: 24
      material: OAK_DOOR
      material-off: GRAY_DYE
      requires-module: chat
      name: "<#6bc6ff><bold>Join and leave messages"
      lore: ["<gray>See when players join", "<gray>and leave.", "", "<gray>Now: <state>", "", "<#7ee081>Click to switch"]
    back: {slot: 31}
    close: {slot: 31}

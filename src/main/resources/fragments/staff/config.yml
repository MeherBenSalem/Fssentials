vanish:
  # Show "<player> left the game" / "joined the game" to players when someone vanishes or reappears.
  fake-messages: true
  # Vanished players don't pick up items, can't be hurt or get hungry, and don't press plates or tripwires.
  prevent-pickup: true
  invulnerable: true
  no-physical-interact: true
  # Leave vanished players out of the server list's player count and sample.
  hide-from-server-list: true
  # Vanished players don't count for skipping the night.
  ignore-sleep: true
  # Seconds between action bar reminders while vanished (0 = off).
  reminder-seconds: 3

staff:
  # How /whois shows dates (Java DateTimeFormatter pattern, server time zone).
  date-format: "yyyy-MM-dd HH:mm"

maintenance:
  # The screen players see when they can't join. <timer> is the time left on a running timer.
  kick-message: "<#ff6b6b><bold>Under maintenance</bold><newline><newline><gray>We're working on the server.<newline><gray>Please come back later."
  # The server list text while maintenance is on: two lines. Use a list of lists for several that take turns.
  motd:
    - "<#ff6b6b><bold>Under maintenance"
    - "<gray>We'll be back soon."
  # Shown in place of the player count on the server list ("" to keep the count).
  version-text: "<#ff6b6b>Maintenance"
  # Players who may not stay are sent away when maintenance switches on.
  kick-on-enable: true
  # Seconds before a timer switches maintenance on or off at which everyone is told.
  countdown: [600, 300, 120, 60, 30, 10, 5, 4, 3, 2, 1]

iplock:
  # Lock accounts (usually staff) to the IPs they may join from: an address, 1.2.3.* or a range like 10.0.0.0/24.
  # Manage locks with /iplock. donutessentials.iplock.bypass skips the check.
  enabled: true
  kick-message: "<#ff6b6b>This account can't join from your IP address.<newline><gray>Ask a server admin if this is wrong."
  # Write refused logins to the console.
  log-blocked-attempts: true

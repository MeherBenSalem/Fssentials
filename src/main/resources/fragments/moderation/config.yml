moderation:
  # Announce punishments to everyone. -s keeps one silent: only staff with donutessentials.notify.silent see it.
  # Notes are always staff-only.
  broadcast: true
  # How dates are shown in lists and ban screens (Java DateTimeFormatter pattern).
  date-format: "yyyy-MM-dd HH:mm"
  # Lines per page in /history, /banlist, /warns and /notes.
  history-page-size: 8
  # Reasons staff can type as @name: /ban Kiri @hacking
  layouts:
    toxicity: "Being toxic in chat"
    spam: "Spamming messages"
    exploit: "Using unfair exploits"
    hacking: "Using a hacked client"
    griefing: "Griefing"
  # Durations staff can type as #name: /tempmute Kiri #short
  time-layouts:
    default: "1d"
    short: "30m"
    long: "7d"
  # Commands muted players can't use.
  muted-blocked-commands: [msg, tell, w, m, whisper, r, reply, mail, me, say]
  # When a player's active warnings reach a number, this console command runs (<player>, <count>).
  # Temporary warnings stop counting when they expire. Remove the entries to switch it off.
  warn-escalation:
    3: "tempmute <player> 1h Reached 3 warnings"
    5: "tempban <player> 1d Reached 5 warnings"
  alts:
    # Tell staff (donutessentials.alerts.alts) when a joining player shares an address with a banned account.
    alert-banned: true
  freeze:
    # Ban players who log out while frozen (otherwise staff are only told).
    ban-on-logout: false
    ban-reason: "Logged out while frozen"
    # Commands frozen players can still use.
    allowed-commands: [msg, tell, w, r, reply, staffchat, sc, report]
  reports:
    # Seconds between two reports from the same player (staff are exempt).
    cooldown-seconds: 60
  commandspy:
    # Commands never shown to spies (passwords!).
    hidden: [login, l, register, reg, changepassword, changepw, cp, 2fa]
  discord:
    # Post punishments and reports to discord.webhook-url.
    punishments: true
    reports: true

sounds:
  warned: "entity.villager.no 0.8 0.8"
  report: "block.note_block.pling 0.6 1.4"

  id-not-found: "<#ff6b6b>No active punishment with ID <white>#<id></white>."
  not-found: "<#ff6b6b><white><input></white> has no active punishment of that kind."

  screen:
    ban: "<#ff6b6b><bold>You are banned</bold><newline><newline><gray>Reason <white><reason><newline><gray>Expires <white><until><newline><newline><dark_gray>ID #<id>"

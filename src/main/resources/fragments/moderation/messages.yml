    active: "<type> <gray>until <white><until></white> <dark_gray>#<id>"
    online: "online now"
    ago: "<time> ago"
  info:
    - "<dark_gray><st>                                        </st>"
    - "<type> <dark_gray>#<id></dark_gray> <gray>· <status>"
    - "<gray>Player <white><player>"
    - "<gray>Reason <white><reason>"
    - "<gray>By <white><staff></white> <gray>on <white><created>"
    - "<gray>Duration <white><duration></white> <dark_gray>·</dark_gray> <gray>until <white><until>"
    - "<gray>Lifted by <white><removed_by></white> <dark_gray>(<removed_reason>)"
    - "<dark_gray><st>                                        </st>"

  alts:
    header: "<#6bc6ff><bold>Alts</bold></#6bc6ff> <gray>of <white><player></white> <dark_gray>(<count>)"
    none: "<gray>No other account was seen on <white><player></white>'s addresses."
    line: "<dark_gray>-</dark_gray> <white><player></white> <dark_gray>· <shared> shared · seen <seen>"
    line-banned: "<dark_gray>-</dark_gray> <#ff6b6b><player> <bold>BANNED</bold></#ff6b6b> <dark_gray>· <shared> shared · seen <seen>"
    alert: "<#ff6b6b>Possible ban evasion:</#ff6b6b> <white><player></white> <gray>shares an address with banned <white><banned></white>."

  freeze:
    frozen: "<#6bc6ff>You were frozen by <white><staff></white>. Don't log out; staff will talk to you."
    unfrozen: "<#7ee081>You were unfrozen. You can move again."
    still-frozen: "<#6bc6ff>You are still frozen. Don't log out; staff will talk to you."
    done: "<gray>Froze <white><player></white>."
    undone: "<gray>Unfroze <white><player></white>."
    staff-frozen: "<white><staff></white> <gray>froze <white><player></white>."
    staff-unfrozen: "<white><staff></white> <gray>unfroze <white><player></white>."
    exempt: "<#ff6b6b><white><player></white> can't be frozen."
    title: "<#6bc6ff><bold>Frozen"
    subtitle: "<gray>Don't log out. Staff will talk to you."
    blocked: "<#ff6b6b>You can't do that while frozen."
    logout: "<#ff6b6b><white><player></white> logged out while frozen."

  reports:
    sent: "<#7ee081>Thanks. Staff will look at your report on <white><player></white>."
    self: "<#ff6b6b>You can't report yourself."
    cooldown: "<#ff6b6b>You can report again in <white><time></white>."
    notify: "<#a77bff>[Report #<id>]</#a77bff> <white><reporter></white> <gray>reported <white><player></white><gray>: <white><reason></white>"
    claimed: "<#a77bff>[Report #<id>]</#a77bff> <white><staff></white> <gray>is handling the report on <white><player></white>."
    closed: "<gray>Closed report <white>#<id></white> on <white><player></white>."
    closed-reporter: "<#7ee081>Staff have handled your report on <white><player></white>."
    not-found: "<#ff6b6b>No open report <white>#<id></white>."
    teleported: "<gray>Teleported to <white><player></white>."
    teleported-last: "<gray><white><player></white> is offline: teleported to where they were when reported."
    no-location: "<#ff6b6b><white><player></white> is offline and the report has no location."

  staffchat:
    format: "<#a77bff><bold>Staff</bold></#a77bff> <white><player></white><dark_gray>:</dark_gray> <#e8dcff><message>"
    toggled-on: "<#a77bff>Your chat now goes to staff chat. <gray>Run it again to stop."
    toggled-off: "<gray>Your chat goes to everyone again."

  commandspy:
    "on": "<gray>Command spy is <#7ee081>on</#7ee081>."
    "off": "<gray>Command spy is <#ff6b6b>off</#ff6b6b>."
    line: "<dark_gray>[Spy]</dark_gray> <gray><player><dark_gray>:</dark_gray> <white><command>"

  # Words used in Discord posts (plain text).
  discord:
    lifted: "Lifted"
    staff: "Staff"
    duration: "Duration"
    report: "Report"
    reporter: "Reported by"


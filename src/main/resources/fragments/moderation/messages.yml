  banlist-header: "<#ff6b6b><bold>Active punishments</bold></#ff6b6b> <dark_gray>(<count>, page <page>/<pages>)"
  check:
    lines:
      - "<dark_gray><st>                                        </st>"
      - "<#6bc6ff><bold><player></bold></#6bc6ff> <dark_gray>·</dark_gray> <gray>last seen <white><last_seen>"
      - "<gray>UUID <white><uuid>"
      - "<gray>IP <white><ip></white> <dark_gray>·</dark_gray> <gray>Alts <white><alts>"
      - "<gray>First joined <white><first_join>"

kits:
  # When true, each kit needs donutessentials.kit.<name>; otherwise everyone can claim every kit.
  per-kit-permissions: false
  # Hide kits a player can't claim from the kits menu (instead of showing them as locked).
  hide-locked: false
  # A kit that doesn't fit: DENY (the player is told how many slots to free) or DROP (the rest falls at their feet).
  full-inventory: DENY
  # Put armour and shields from a kit straight on when those slots are empty.
  auto-equip: true
  # Kits given to players on their very first join (they count as claimed).
  first-join: [starter]
  # On the first start, create a "starter" kit (stone tools and bread, once per player). Never recreated afterwards.
  create-starter-kit: true

economy:
  # Money every new player starts with.
  starting-balance: 100
  # The highest balance a player can have. 0 for no limit.
  max-balance: 0
  # Rank tiers (donutessentials.tier.<name>) with a higher limit, e.g. vip: 50000000. 0 removes the limit.
  balance-caps: {}
  # The smallest amount /pay accepts.
  min-payment: 0.01
  currency:
    symbol: "$"
    decimals: 2
    # {symbol} and {amount}, e.g. "{amount} coins".
    format: "{symbol}{amount}"
    name-singular: "dollar"
    name-plural: "dollars"
  # Write every balance change to logs/economy-YYYY-MM-DD.log.
  log: true
  baltop:
    # How often the richest-players list is worked out, and how many players it holds.
    refresh-seconds: 60
    size: 100

sounds:
  kit-claim: "entity.item.pickup 0.8 1.0"
  payment-sent: "entity.experience_orb.pickup 0.6 1.2"
  payment-received: "entity.player.levelup 0.6 1.6"

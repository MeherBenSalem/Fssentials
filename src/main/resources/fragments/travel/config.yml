# Fragment of config.yml (fork "travel"). `teleport.tpa` and `combat.on-logout` go into the existing sections.

teleport:
  tpa:
    # Seconds before an unanswered teleport request expires.
    expire-seconds: 60

combat:
  # A player who disconnects in combat: KILL (they die and drop their items) or NOTHING.
  on-logout: KILL

warps:
  # When true, each warp needs donutessentials.warp.<name> (donutessentials.warps.all gives every warp).
  per-warp-permissions: false
  # The icon of a warp set with an empty hand.
  default-icon: ENDER_PEARL

spawn:
  # New players start at the first-join spawn (/setspawn first), or the spawn (/setspawn). Nothing happens until one
  # of them is set.
  on-first-join: true
  # Send everyone to spawn every time they join.
  on-join: false
  # Players without a bed or respawn anchor respawn at spawn (once /setspawn is used).
  on-respawn: true

rtp:
  # Spots tried before giving up (each loads one chunk).
  max-attempts: 12
  # Where /rtp goes when the player's world is not enabled below.
  default-world: world
  # Worlds players can /rtp in. center: spawn (the world spawn), or "x, z" like "0, 0".
  worlds:
    world: {enabled: true, radius: 5000, min-radius: 300, center: spawn}
    world_nether: {enabled: false, radius: 2000, min-radius: 100, center: spawn}
    world_the_end: {enabled: false, radius: 1500, min-radius: 200, center: spawn}
  # Biomes to skip: any biome whose name contains one of these words.
  blocked-biomes: [ocean, river]
  # Blocks nobody should land on or in.
  unsafe-blocks: [LAVA, WATER, MAGMA_BLOCK, CACTUS, FIRE, SOUL_FIRE, CAMPFIRE, SOUL_CAMPFIRE, POWDER_SNOW,
    SWEET_BERRY_BUSH, WITHER_ROSE, POINTED_DRIPSTONE, BUBBLE_COLUMN, SEAGRASS, TALL_SEAGRASS, KELP, KELP_PLANT]

sounds:
  tpa-request: "block.note_block.pling 0.6 1.4"
  warp-set: "block.beacon.activate 0.4 1.6"

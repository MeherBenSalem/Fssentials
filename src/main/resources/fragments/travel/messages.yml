# Fragment of messages.yml (fork "travel"). New top-level sections: tpa, back, staff-teleport, combat, warps,
# spawn, rtp; `buttons` and `usage` entries go into those sections.

tpa:
  sent: "<gray>Request sent to <white><player></white>. It expires in <white><seconds>s</white>."
  sent-here: "<gray>Asked <white><player></white> to come to you. It expires in <white><seconds>s</white>."
  received: "<white><player></white> <gray>wants to teleport to you."
  received-here: "<white><player></white> <gray>wants you to teleport to them."
  # Shown before the [Accept] [Deny] buttons, on the line under the request.
  buttons-line: "<dark_gray>  » </dark_gray>"
  accepted: "<#7ee081>Accepted <white><player></white>'s request."
  auto-accepted: "<gray>Accepted <white><player></white>'s request automatically <dark_gray>(/tpauto)</dark_gray>."
  accepted-sender: "<#7ee081><white><player></white> accepted your request."
  teleported: "<gray>Teleported to <white><player></white>."
  denied: "<gray>Denied <white><player></white>'s request."
  denied-sender: "<#ff6b6b><white><player></white> denied your request."
  cancelled: "<gray>Took back your request to <white><player></white>."
  cancelled-target: "<gray><white><player></white> took back their request."
  expired-sender: "<gray>Your request to <white><player></white> expired."
  expired-target: "<gray>The request from <white><player></white> expired."
  left: "<gray><white><player></white> left, so the teleport request is gone."
  none: "<#ff6b6b>You have no teleport requests."
  none-from: "<#ff6b6b>You have no request from <white><player></white>."
  none-sent: "<#ff6b6b>You have no requests waiting."
  offline: "<#ff6b6b><white><player></white> is no longer online."
  self: "<#ff6b6b>You can't teleport to yourself."
  target-off: "<#ff6b6b><white><player></white> isn't taking teleport requests."
  toggled-off: "<gray>Teleport requests are now <#ff6b6b>off</#ff6b6b>. <dark_gray>(/tptoggle)"
  toggled-on: "<gray>Teleport requests are now <#7ee081>on</#7ee081>."
  auto-on: "<gray>You now accept every <white>/tpa</white> at once. <dark_gray>(/tpauto)"
  auto-off: "<gray>You answer teleport requests yourself again."

back:
  none: "<#ff6b6b>There's nowhere to go back to."
  world-missing: "<#ff6b6b>That place is in <white><world></white>, which isn't loaded."
  returned: "<gray>Back where you were <dark_gray>(<white><coords></white>)</dark_gray>."

staff-teleport:
  here-sender: "<gray>Brought <white><player></white> to you."
  here-target: "<gray><white><player></white> teleported you to them."
  to: "<gray>Teleported to <white><player></white>."

combat:
  tagged: "<#ff6b6b>You're in combat for <white><seconds>s</white>. Don't log out."
  untagged: "<#7ee081>You're no longer in combat."
  actionbar: "<#ff6b6b>⚔ In combat <white><seconds>s"
  blocked-command: "<#ff6b6b>You can't use that in combat. Wait <white><seconds>s</white>."
  logged-out: "<white><player></white> <gray>logged out in combat and died."

warps:
  set: "<#7ee081>Warp <white><warp></white> set."
  moved: "<#7ee081>Warp <white><warp></white> moved here."
  deleted: "<gray>Warp <white><warp></white> deleted."
  teleported: "<gray>Warped to <white><warp></white>."
  not-found: "<#ff6b6b>There's no warp called <white><warp></white>. <gray>Warps: <white><warps>"
  no-access: "<#ff6b6b>You can't use the warp <white><warp></white>."
  world-missing: "<#ff6b6b>Warp <white><warp></white> is in <white><world></white>, which isn't loaded."
  invalid-name: "<#ff6b6b>Warp names are 1-24 letters, digits, - or _."
  list: "<gray>Warps (<white><count></white>): <white><warps>"
  none-short: "none yet"
  menu-delete-hint: "<#ff6b6b>Shift + right-click to delete"
  confirm-delete: "Delete this warp"

spawn:
  teleported: "<gray>Welcome to spawn."
  sent-other: "<gray>Sent <white><player></white> to spawn."
  set: "<#7ee081>Spawn set at <white><coords></white> in <white><world></white>."
  set-first: "<#7ee081>New players now start at <white><coords></white> in <white><world></white>."
  not-set: "<#ff6b6b>There's no spawn to go to."

rtp:
  searching: "<gray>Looking for a safe spot..."
  teleported: "<gray>Landed at <white><coords></white> in <white><world></white>."
  sent-other: "<gray>Sent <white><player></white> to <white><coords></white>."
  not-found: "<#ff6b6b>No safe spot found. Try again."
  unknown-world: "<#ff6b6b>You can't random-teleport in <white><world></white>. <gray>Worlds: <white><worlds>"
  disabled-world: "<#ff6b6b>Random teleport isn't available here."

buttons:
  tpa-accept:
    label: "<#7ee081><bold>[Accept]</bold>"
    hover: "<gray>Click to let <white><player></white> come"
  tpa-deny:
    label: "<#ff6b6b><bold>[Deny]</bold>"
    hover: "<gray>Click to refuse"
  tpa-cancel:
    label: "<#ff6b6b>[Cancel]"
    hover: "<gray>Click to take the request back"

usage:
  tpa: "<gray>Usage: <white>/<label> <player></white>"
  tpahere: "<gray>Usage: <white>/<label> <player></white>"
  tphere: "<gray>Usage: <white>/<label> <player></white>"
  tpo: "<gray>Usage: <white>/<label> <player></white>"
  setwarp: "<gray>Usage: <white>/<label> <name></white>"
  delwarp: "<gray>Usage: <white>/<label> <name></white>"

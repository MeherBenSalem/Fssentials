chat:
  # Format chat here. false leaves the format to another chat plugin (the checks below still apply).
  format-enabled: true
  # MiniMessage (& codes work too). <prefix>, <suffix> and <group> come from your permissions plugin through Vault
  # (LuckPerms works); <name>, <display_name> (the nickname, or the name), <world> and <message>.
  # PlaceholderAPI placeholders work too.
  format: "<prefix><display_name><suffix> <dark_gray>»</dark_gray> <gray><message>"
  # A format per permission group (the player's primary group, lower case) replaces the one above.
  formats:
    admin: "<#ff6b6b>[Admin]</#ff6b6b> <white><display_name></white> <dark_gray>»</dark_gray> <white><message>"
  # Shown in front of every nickname (e.g. "~"), so nicknames can't pass for real names.
  nickname-prefix: ""
  # Show nicknames in the tab list too.
  nickname-in-tab: true
  nickname:
    min-length: 3
    max-length: 16
    # What a nickname may contain once colours are taken out (a Java regular expression).
    allowed: "[A-Za-z0-9_]+"
  # "[item]" in chat shows the held item with its tooltip (donutessentials.chat.item).
  item:
    enabled: true
  # Names of online players in chat are highlighted and ping them. require-at: only "@name" counts.
  mentions:
    enabled: true
    require-at: false
  # For players without donutessentials.chat.bypass.
  anti-spam:
    enabled: true
    # The shortest time between two messages.
    min-delay-ms: 800
    # The same message again within this many seconds is refused.
    repeat-window-seconds: 20
  filter:
    enabled: true
    # Whole words, any case, replaced with stars.
    words: []
    # Words replaced with something else, e.g. ez: "gg".
    replacements: {}
    # Refuse messages with links, except links to the domains below (e.g. your website).
    block-links: true
    allowed-links: []
  # Join, quit and first-join messages from messages.yml (chat.join, chat.quit, chat.first-join).
  # false leaves them to vanilla or another plugin.
  join-quit-messages: true

broadcast:
  # The lines /broadcast sends to chat. <title> is the text before "|", <message> the text after it.
  format:
    - "<dark_gray><st>                                        </st>"
    - "<#6bc6ff><bold><title></bold>"
    - "<white><message>"
    - "<dark_gray><st>                                        </st>"
  # Also show the title (and the message as a subtitle) on screen.
  title: true
  sound:
    enabled: true
    name: "block.note_block.pling"
    volume: 1.0
    pitch: 1.0

announcements:
  # One entry every interval-seconds, in order (or at random). An entry is one line, or a list of lines.
  # <player> is the reader's name; PlaceholderAPI placeholders work too.
  enabled: true
  interval-seconds: 300
  random: false
  messages:
    - "<#6bc6ff>✦</#6bc6ff> <gray>Set a home with <white>/sethome</white> and go back with <white>/home</white>."
    - - "<#6bc6ff>✦</#6bc6ff> <gray>Lost? <white>/spawn</white> takes you back to spawn."
      - "<#6bc6ff>✦</#6bc6ff> <gray>Visit a friend with <white>/tpa <player></white>."
    - "<#6bc6ff>✦</#6bc6ff> <gray>Read the rules with <white>/rules</white>."

messaging:
  mail:
    # Letters a mailbox holds; more are refused until the player clears it.
    max-per-player: 50
    # Seconds between two letters from the same player (donutessentials.msg.bypass skips it).
    cooldown-seconds: 10

afk:
  # Minutes without moving, looking around, chatting or using commands before a player is AFK. 0 = only /afk.
  idle-minutes: 5
  # Kick players AFK for this many minutes (donutessentials.afk.kickexempt never). 0 = never.
  kick-minutes: 0
  # Tell everyone when someone goes AFK or comes back (vanished players never).
  announce: true
  # Show [AFK] in the tab list (afk.tab-prefix in messages.yml).
  tab-tag: true
  # AFK players don't count when skipping the night by sleeping.
  ignore-sleep: true

sounds:
  mention: "entity.experience_orb.pickup 0.6 1.6"
  message: "entity.item.pickup 0.5 1.4"

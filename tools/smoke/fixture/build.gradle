// Test-only server fixture for the smoke matrix: console helpers and an API listener.
// Never shipped; see tools/smoke/README.md. Build the plugin first (the fixture compiles against its jar).
plugins {
    id 'java'
}

repositories {
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    mavenCentral()
    maven {
        url = 'https://repo.extendedclip.com/releases/'
        content { includeGroup 'me.clip' }
    }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.20.1-R0.1-SNAPSHOT'
    compileOnly 'me.clip:placeholderapi:2.11.6'
    compileOnly files("../../../build/libs/DonutEssentials-${findProperty('donutessentials.version') ?: '3.0.0'}.jar")
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

jar {
    archiveFileName.set('EssLabFixture.jar')
}

# Publish Donut Essentials to CurseForge on version tags (NightBeam convention: CurseForge only since 24 Nov 2026).
#
# Secrets:
#   CURSEFORGE_TOKEN    (upload)
#   CURSEFORGE_API_KEY  (Core API, for the same-day guard and the "already out" check)
#
# Repo variable:
#   CURSEFORGE_ID (Donut Essentials: 1487015)
#
# The existing Modrinth project stays up as it is but gets no new versions.
#
# Same-day guard (NightBeam convention): scripts/same_day_guard.mjs stops a real run if this plugin already had a
# release today (Africa/Tunis day), on CurseForge or in an earlier Publish run whose upload step ran. It runs first
# and again right before the upload; a dry run only reports it.
# Dry run (no uploads): gh workflow run publish.yml -f version=<x.y.z> -f dry_run=true
#
# Usage after a release build is ready:
#   git tag v3.0.0 && git push --tags
#
# Platforms and Minecraft versions come from release/supported-minecraft.json; the changelog is
# DonutEssentials-<version>-PatchNotes.md when it exists, else PATCHNOTES.md.

name: Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Version (without v) when not tagging
        required: false
      dry_run:
        description: Skip uploads if true
        required: false
        default: "false"

# One Publish at a time per repo, so two runs can't both pass the same-day guard.
concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Same-day guard
        env:
          CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PUBLISH_WORKFLOW: publish.yml
          UPLOAD_STEP: Upload CurseForge|Upload Modrinth + CurseForge
          DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/same_day_guard.mjs

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.version }}" ]]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "Provide a v*.*.* tag or workflow_dispatch version" >&2
            exit 1
          fi

      # A tag pushed after the version was published by hand must not upload it twice.
      - name: Check whether this version is out already
        id: published
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID || '1487015' }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          VERSION: ${{ steps.ver.outputs.version }}
        shell: bash
        run: |
          if [ -n "${CURSEFORGE_ID:-}" ] && curl -fsS -H "x-api-key: ${CURSEFORGE_API_KEY}" \
              "https://api.curseforge.com/v1/mods/${CURSEFORGE_ID}/files?pageSize=50" \
              | jq -e --arg v "$VERSION" 'any(.data[]; .displayName == $v)' > /dev/null; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "$VERSION is already on CurseForge: nothing to upload."
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Find jars
        id: jars
        shell: bash
        run: |
          mapfile -t JARS < <(find . -type f -path "*/build/libs/DonutEssentials-*.jar" \
            ! -name "*-sources.jar" ! -name "*-javadoc.jar" \
            ! -name "*-dev.jar" ! -name "*-dev-shadow.jar" | head -n 5)
          if [ ${#JARS[@]} -eq 0 ]; then
            echo "No DonutEssentials jars in build/libs" >&2
            exit 1
          fi
          printf '%s\n' "${JARS[@]}"
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "list<<$EOF" >> "$GITHUB_OUTPUT"
          printf '%s\n' "${JARS[@]}" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - name: Same-day guard (again, right before upload)
        env:
          CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PUBLISH_WORKFLOW: publish.yml
          UPLOAD_STEP: Upload CurseForge|Upload Modrinth + CurseForge
          DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/same_day_guard.mjs

      - name: Upload CurseForge
        if: ${{ inputs.dry_run != 'true' && steps.published.outputs.already != 'true' }}
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID || '1487015' }}
          VERSION: ${{ steps.ver.outputs.version }}
          JAR_LIST: ${{ steps.jars.outputs.list }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CURSEFORGE_ID:-}" || { echo "Set the repo variable CURSEFORGE_ID" >&2; exit 1; }
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const version = process.env.VERSION;
          const jars = process.env.JAR_LIST.split(/\n/).map(s => s.trim()).filter(Boolean);
          const support = JSON.parse(fs.readFileSync('release/supported-minecraft.json', 'utf8'));
          const PLUGIN_LOADERS = support.loaders;
          const PLUGIN_GAME_VERSIONS = support.game_versions;
          let changelog = `Release ${version}`;
          for (const f of [`DonutEssentials-${version}-PatchNotes.md`, 'PATCHNOTES.md', 'PATCH_NOTES.md']) {
            if (fs.existsSync(f)) { changelog = fs.readFileSync(f, 'utf8'); break; }
          }

          (async () => {
            for (const jar of jars) {
              // CurseForge files Paper plugins under Bukkit; the platform tags follow the supported loaders.
              const gameVersionNames = [
                ...PLUGIN_GAME_VERSIONS,
                'Bukkit', ...PLUGIN_LOADERS.map((l) => l.charAt(0).toUpperCase() + l.slice(1)),
              ];
              const meta = {
                changelog,
                changelogType: 'markdown',
                displayName: version,
                gameVersionNames,
                releaseType: 'release',
              };
              const cfForm = new FormData();
              cfForm.append('metadata', JSON.stringify(meta));
              cfForm.append('file', new Blob([fs.readFileSync(jar)]), path.basename(jar));
              let ok = false;
              for (let attempt = 1; attempt <= 3; attempt++) {
                const cfRes = await fetch(
                  `https://minecraft.curseforge.com/api/projects/${process.env.CURSEFORGE_ID}/upload-file`,
                  { method: 'POST', headers: { 'X-Api-Token': process.env.CURSEFORGE_TOKEN }, body: cfForm },
                );
                const cfText = await cfRes.text();
                console.log('CurseForge attempt', attempt, cfRes.status, cfText.slice(0, 200));
                if (cfRes.ok) { ok = true; console.log('CurseForge OK', path.basename(jar), cfText.slice(0, 160)); break; }
                if (cfRes.status >= 500) await new Promise(r => setTimeout(r, 15000));
                else break;
              }
              if (!ok) throw new Error('CurseForge upload failed');
            }
          })().catch((e) => { console.error(e); process.exit(1); });
          NODE

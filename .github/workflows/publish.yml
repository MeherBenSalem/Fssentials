# Publish Donut Essentials (Maven/Paper) to Modrinth + CurseForge on version tags.
#
# Org/repo secrets:
#   MODRINTH_TOKEN
#   CURSEFORGE_TOKEN
#   CURSEFORGE_API_KEY
#
# Repo variables (defaults used when unset):
#   MODRINTH_ID   default 1YpSYvSs
#   CURSEFORGE_ID default 1487015
#
# Usage after a release build is ready:
#   git tag v2.0.0 && git push --tags

name: Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Version (without v) when not tagging
        required: false
      dry_run:
        description: Skip uploads if true
        required: false
        default: "false"
      platforms:
        description: "modrinth, curseforge, or both"
        required: false
        default: "both"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.version }}" ]]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "Provide a v*.*.* tag or workflow_dispatch version" >&2
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build
        run: mvn -B package

      - name: Find jar
        id: jar
        shell: bash
        run: |
          mapfile -t JARS < <(find target -maxdepth 1 -type f -name 'donutessentials-*.jar' ! -name 'original-*' | head -n 5)
          if [ ${#JARS[@]} -eq 0 ]; then
            echo "No donutessentials jar in target/" >&2
            exit 1
          fi
          JAR="${JARS[0]}"
          echo "path=$JAR" >> "$GITHUB_OUTPUT"
          echo "Using jar: $JAR"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Upload Modrinth + CurseForge
        if: ${{ inputs.dry_run != 'true' }}
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          MODRINTH_ID: ${{ vars.MODRINTH_ID || '1YpSYvSs' }}
          CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID || '1487015' }}
          VERSION: ${{ steps.ver.outputs.version }}
          JAR_PATH: ${{ steps.jar.outputs.path }}
          PLATFORMS: ${{ inputs.platforms || 'both' }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/publish-local.mjs \
            --jar "$JAR_PATH" \
            --version "$VERSION" \
            --platforms "$PLATFORMS"

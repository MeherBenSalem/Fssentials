name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      # Unit tests, the Folia-safety check and the jar, then the same sources against every Paper API from 1.20.6 to 26.3.
      - run: ./gradlew build compileMatrix --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: DonutEssentials
          path: build/libs/DonutEssentials-*.jar
